services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fwcms
      POSTGRES_PASSWORD: fwcms_dev_password
      POSTGRES_DB: fwcms
    ports:
      - "5432:5432"
    volumes:
      - fwcms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fwcms -d fwcms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fwcms_pgdata:
